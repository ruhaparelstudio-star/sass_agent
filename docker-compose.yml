services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sass_agent_app
    working_dir: /var/www/html
    user: "1000:1000"
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: sass_agent_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: sass_agent_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sass_agent
      MYSQL_USER: sass_agent
      MYSQL_PASSWORD: sass_agent
    ports:
      - "33060:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: sass_agent_redis
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sass_agent_worker
    working_dir: /var/www/html
    user: "1000:1000"
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sass_agent_scheduler
    working_dir: /var/www/html
    user: "1000:1000"
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  wa-gateway:
    image: node:22-alpine
    container_name: sass_agent_wa_gateway
    working_dir: /app/wa-gateway
    command: sh -c "npm install && npm run start"
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      LARAVEL_BASE_URL: http://nginx
      WA_INTERNAL_SECRET: ${WA_INTERNAL_SECRET:-}
      LARAVEL_INTERNAL_AUTH_TOKEN: ${LARAVEL_INTERNAL_AUTH_TOKEN:-}
    volumes:
      - ./:/app
    depends_on:
      - nginx

volumes:
  mysql_data:
